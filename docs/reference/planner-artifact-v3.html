<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Yvonne's Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a notebook spread. Left page = planner / overview / done log; right page = to-dos, goals and calendar. Stacks on phones. */
:root{
  --desk:#ece6dc; --paper:#fbf8f2; --paper2:#f3eee6; --rule:#e7e2da; --margin:#e9b8ab; --ink:#2d2b30; --muted:#7a7469; --line:#e0d9ce; --dots:#b9b1a4;
  --accent:#34507f; --accent-fg:#ffffff; --good:#5d8a5a; --bad:#b9853a; --ugly:#b8574a; --clash:#d0453a;
  --p-sage:#8fae8b; --p-dusty:#7f9cc2; --p-terracotta:#c98366; --p-lavender:#a99ac9; --p-honey:#d2ab55; --p-rose:#d398a6; --p-mist:#86b4b2; --p-slate:#8e95a1; --p-plum:#a07aa1; --p-moss:#9aa36a;
  --c-event:#24365e; --event-fg:#f4f1ea;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive; --body:"Karla",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#131317; --paper:#1d1d22; --paper2:#26262c; --rule:#2c2c33; --margin:#5e3a36; --ink:#ece7de; --muted:#a39d92; --line:#34343c; --dots:#5a5850;
  --accent:#9db4e3; --accent-fg:#141a26; --good:#93c08e; --bad:#ddb06a; --ugly:#e08b7d; --clash:#f07466;
  --p-sage:#9fc09a; --p-dusty:#93aed3; --p-terracotta:#da987c; --p-lavender:#b9acdb; --p-honey:#dfc072; --p-rose:#e0a9b6; --p-mist:#9ac6c3; --p-slate:#a3a9b4; --p-plum:#bb95bb; --p-moss:#b0b87e;
  --c-event:#8fa6dc; --event-fg:#141a26;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#131317; --paper:#1d1d22; --paper2:#26262c; --rule:#2c2c33; --margin:#5e3a36; --ink:#ece7de; --muted:#a39d92; --line:#34343c; --dots:#5a5850;
  --accent:#9db4e3; --accent-fg:#141a26; --good:#93c08e; --bad:#ddb06a; --ugly:#e08b7d; --clash:#f07466;
  --p-sage:#9fc09a; --p-dusty:#93aed3; --p-terracotta:#da987c; --p-lavender:#b9acdb; --p-honey:#dfc072; --p-rose:#e0a9b6; --p-mist:#9ac6c3; --p-slate:#a3a9b4; --p-plum:#bb95bb; --p-moss:#b0b87e;
  --c-event:#8fa6dc; --event-fg:#141a26;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{background:var(--desk);color:var(--ink)}
body{font-family:var(--body);font-size:14.5px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:1440px;margin:0 auto;display:grid;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
header.top h1{font-family:var(--hand);font-size:40px;line-height:1;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.nav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--ugly)}
.btn.ghost{border-color:transparent;background:transparent}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
/* notebook paper */
.page{background:var(--paper);border-radius:4px 12px 12px 4px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(60,45,25,.08);min-width:0;position:relative;overflow:hidden}
.page.lined{background-image:linear-gradient(90deg,transparent 54px,var(--margin) 54px,var(--margin) 55px,transparent 55px),repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px);background-color:var(--paper)}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:14px 16px 10px 70px;border-bottom:2px solid var(--rule);background:var(--paper)}
.page-head h2{font-family:var(--hand);font-size:32px;line-height:1;font-weight:700}
@media (max-width:600px){.page.lined{background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 41px,transparent 41px),repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px)}.page-head{padding-left:52px}}
.levels{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
/* progress strip */
.strip{padding:12px 16px 12px 70px;border-bottom:1px solid var(--rule);background:var(--paper);display:grid;gap:10px}
@media (max-width:600px){.strip{padding-left:52px}}
.strip-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.count{font-size:15px}
.count b{font-family:var(--hand);font-size:26px;line-height:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.rings{display:flex;flex-wrap:wrap;gap:6px}
.ringbtn{display:grid;justify-items:center;gap:2px;border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 6px;min-width:76px;max-width:120px}
.ringbtn:hover{background:var(--paper2)}
.ringbtn[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,transparent)}
.ringbtn .lb{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ringbtn .sm{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.crumb{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
/* planner rows */
.sheet{padding:6px 12px 18px 0}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:stretch;min-height:32px}
@media (max-width:600px){.row{grid-template-columns:46px minmax(0,1fr)}}
.row .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding:7px 10px 0 0;line-height:1.15}
.row .tm b{display:block;color:var(--ink);font-weight:500}
.blk{display:flex;align-items:center;gap:8px;margin:2px 0 2px 10px;padding:5px 10px;border-radius:6px;text-align:left;border:0;background:color-mix(in srgb,var(--cc) 24%,var(--paper));color:var(--ink);position:relative;min-width:0;width:calc(100% - 10px)}
.blk::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--cc)}
.blk .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .nm small{font-weight:500;color:var(--muted)}
.blk .ds{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.blk .chev{font-size:12px;color:var(--muted);width:12px;flex:none;transition:transform .15s}
.blk[aria-expanded="true"] .chev{transform:rotate(90deg)}
.blk .inner{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:5px 10px;min-width:0;flex:1}
.blk .inner:focus-visible{outline:2px solid var(--accent)}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--cc);background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--paper);padding:0;margin-left:10px}
.blk.done .tick{background:var(--cc)}
.blk.done .nm{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
.blk.done{background:color-mix(in srgb,var(--cc) 10%,var(--paper));opacity:.7}
.blk.done .tick{opacity:.85}
.blk .tag{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:8px;white-space:nowrap}
.tag.moved{color:var(--bad);border:1px solid currentColor}
.tag.rec{color:var(--muted);border:1px solid var(--line)}
.blk.event{--cc:var(--c-event);background:var(--c-event);color:var(--event-fg)}
.blk.event::before{display:none}
.blk.event .nm small,.blk.event .ds{color:color-mix(in srgb,var(--event-fg) 75%,transparent)}
.blk.event .tag.rec{color:var(--event-fg);border-color:color-mix(in srgb,var(--event-fg) 40%,transparent)}
.blk.clash{box-shadow:0 0 0 2px var(--clash)}
.tag.clash{color:#fff;background:var(--clash);border:0;cursor:pointer;font:inherit;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:8px}
.clashbar{margin:10px 12px 0 70px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--clash);background:color-mix(in srgb,var(--clash) 7%,var(--paper));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.clashbar b{color:var(--clash)}
@media (max-width:600px){.clashbar{margin-left:52px}}
.blk.travel{--cc:var(--c-event);background:transparent;border:1.5px dashed color-mix(in srgb,var(--c-event) 60%,transparent);color:var(--muted);font-size:12.5px;padding:2px 10px}
.blk.travel::before{display:none}
.blk.free{background:transparent;color:var(--muted);font-family:var(--hand);font-size:20px;padding:0 10px;cursor:default;border:1px dotted var(--dots)}
.blk.free::before{display:none}
.blk.sleep{background:transparent;border:1px dotted var(--dots);color:var(--muted);font-weight:600}
.blk.sleep::before{display:none}
.blk.dim{opacity:.32}
.nest{margin-left:22px;border-left:1.5px dotted var(--cc);padding-left:2px}
.nowline{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;height:12px}
.nowline span{font-family:var(--mono);font-size:10.5px;color:var(--clash);text-align:right;padding-right:10px}
.nowline i{display:block;height:2px;background:var(--clash);margin-left:10px;position:relative}
.nowline i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--clash)}
@media (max-width:600px){.nowline{grid-template-columns:46px minmax(0,1fr)}}
.overflow{margin:10px 12px 0 70px;padding:10px 12px;border:1.5px dashed var(--bad);border-radius:8px;display:grid;gap:4px;font-size:13px}
.overflow b{color:var(--bad)}
.habits{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 8px 70px;border-bottom:1px solid var(--rule);background:var(--paper)}
@media (max-width:600px){.habits{padding-left:52px}.overflow{margin-left:52px}}
.habit{display:flex;align-items:center;gap:6px;background:var(--paper2);border-radius:20px;padding:2px 3px 2px 12px;font-size:13px}
.habit button{border:0;width:26px;height:26px;border-radius:50%;background:var(--paper);font-weight:700}
.habit.met{background:color-mix(in srgb,var(--good) 18%,var(--paper2))}
/* week spread */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0}
.wday{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 8px 12px;min-width:0;background-color:var(--paper);background-image:repeating-linear-gradient(var(--paper) 0 27px,var(--rule) 27px 28px)}
.wday.t{background-color:color-mix(in srgb,var(--accent) 5%,var(--paper))}
.wday-h{display:flex;align-items:baseline;gap:6px;border:0;background:var(--paper);padding:0 0 6px;width:100%;text-align:left;border-bottom:2px solid var(--rule);margin-bottom:4px}
.wday-h b{font-family:var(--hand);font-size:26px;line-height:1}
.wday-h span{font-size:12px;color:var(--muted)}
.wday .row{grid-template-columns:40px minmax(0,1fr);min-height:26px}
.wday .row .tm{font-size:10.5px;padding:5px 4px 0 0}
.wday .blk{margin-left:4px;width:calc(100% - 4px);font-size:12.5px;gap:6px}
.wday .blk:not(.split){padding:3px 7px}
.wday .blk .inner{padding:3px 7px;gap:6px}
.wday .blk .ds{display:none}
.wday .blk.free{font-size:17px}
.wday .tick{width:16px;height:16px;font-size:10px;margin-left:7px}
.wday .nest{margin-left:10px}
/* overview */
.ov{padding:14px 16px 20px 70px;display:grid;gap:22px}
@media (max-width:600px){.ov{padding-left:16px;padding-right:12px}}
.ov h3{font-family:var(--hand);font-size:28px;font-weight:700;line-height:1}
.ov h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.gbu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gbu{grid-template-columns:minmax(0,1fr)}}
.gbu section{border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--tone) 8%,var(--paper));border-top:4px solid var(--tone);display:grid;gap:6px;align-content:start}
.gbu h4{margin:0;font-family:var(--hand);font-size:26px;color:var(--tone);line-height:1}
.gbu .it{font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 6px;align-items:baseline}
.gbu .it .why{grid-column:2;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--cc,var(--p-slate));flex:none}
.cat-sec{display:grid;gap:8px}
.cat-sec>h4{margin:0;display:flex;align-items:center;gap:8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--cc)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--paper)}
.gcard .gt{font-weight:700;font-size:15px}
.gcard .gm{font-size:12px;color:var(--muted)}
.gcard ul{grid-column:1/-1;margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:12.5px}
.gcard li{display:flex;gap:6px;align-items:baseline}
.gcard li.d{color:var(--muted)}
.gcard li .mk{width:13px;flex:none;text-align:center}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.ugly{color:var(--ugly)}
.tbl-wrap{overflow-x:auto}
table.fb{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.fb th,table.fb td{padding:6px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.fb th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpis{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.kpi b{font-family:var(--hand);font-size:34px;line-height:1;display:block}
.kpi span{font-size:12px;color:var(--muted)}
/* done log */
.log-day{display:grid;gap:4px}
.log-day h4{margin:0;font-family:var(--hand);font-size:24px}
.log-it{display:grid;grid-template-columns:48px auto minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.log-it .r{font-size:12px;color:var(--muted);text-align:right}
/* drawer */
.drawer{background:var(--paper);border-radius:12px;box-shadow:0 8px 24px rgba(60,45,25,.08);min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:2px solid var(--rule)}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper2);color:var(--ink)}
.pane{padding:12px 14px 16px;display:grid;gap:12px}
.pane h3{font-family:var(--hand);font-size:26px;font-weight:700;line-height:1;display:flex;align-items:center;gap:8px}
.pane h3 .btn{margin-left:auto;font-family:var(--body)}
.pane h3 small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.list{display:grid;gap:5px}
.todo{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--cc) 9%,var(--paper));border-left:4px solid var(--cc)}
.todo.dragging{opacity:.4}
.todo.over{box-shadow:0 -3px 0 var(--accent)}
.todo .grip{cursor:grab;color:var(--muted);font-size:14px;user-select:none;padding:0 2px}
.todo .nm{font-weight:700;min-width:0}
.todo .sm{font-size:12px;color:var(--muted)}
.todo input[type=checkbox]{width:17px;height:17px;accent-color:var(--cc)}
.todo .acts{display:flex;gap:2px}
.todo .mv{display:none}
@media (pointer:coarse){.todo .mv{display:inline-block}.todo .grip{display:none}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:0 7px;border-radius:10px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);background:var(--paper2);border-radius:8px;padding:8px 10px}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;background:var(--paper2)}
.ev .nm{font-weight:700}
.ev .sm{font-size:12px;color:var(--muted)}
.daytoggles{display:flex;gap:4px;flex-wrap:wrap}
.daytoggles label{display:inline-flex}
.daytoggles input{position:absolute;opacity:0;pointer-events:none}
.daytoggles span{padding:4px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.daytoggles input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.daytoggles input:focus-visible+span{outline:2px solid var(--accent)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:12px;width:min(580px,100%);padding:18px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-family:var(--hand);font-size:32px;line-height:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper2);font-weight:400;color:var(--ink)}
.form textarea{min-height:130px;font-family:var(--mono);font-size:13px}
.form .hint{font-size:12px;color:var(--muted);font-weight:400}
.subrows{display:grid;gap:6px}
.subrow{display:grid;grid-template-columns:22px minmax(0,1fr) 70px auto auto auto auto;gap:4px;align-items:center}

<script>
(function(){
"use strict";
// ---------- constants ----------
const GOAL_CATS = ["work","study","selfimp","sports","other"], OTHER_SUBS = ["house","skin","health","care"];
const CAT_DEF = {work:["Work","dusty"], study:["Study","terracotta"], selfimp:["Self-improvement","lavender"], sports:["Sports","sage"], other:["Other","slate"], house:["House duties","honey"], skin:["Skin care","rose"], health:["Health","mist"], care:["Caregiver activities","moss"]};
const OLD_CAT = {interview:"work", housework:"house", dog:"care", selfcare:"skin"};
const normCat = c => OLD_CAT[c] || (CAT_DEF[c] ? c : "other");
let CATS = {}, CATCOL = {};
function syncCats(){ CATS = {}; CATCOL = {}; for (const [k, [n, col]] of Object.entries(CAT_DEF)) { CATS[k] = n; CATCOL[k] = col; } }
const taskCat = t => t.goalId && S.goals[t.goalId] ? normCat(S.goals[t.goalId].category) : normCat(t.category);
function migrateCats(){
  for (const t of Object.values(S.tasks)) { const c = taskCat(t); if (t.category !== c) put("tasks", {...t, category:c}); }
  for (const g of Object.values(S.goals)) { const c = normCat(g.category); const c2 = GOAL_CATS.includes(c) ? c : "other"; if (g.category !== c2) put("goals", {...g, category:c2}); }
}
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const LEVELS = {cat:"Overall", goal:"Goals", task:"Tasks"};
const DEFAULT_SETTINGS = {gapMin:10};
const HORIZON = 42;
const GCAL = "Google Calendar", GCAL_ID = "ylootsma@gmail.com";

// ---------- helpers ----------
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => new Date(s+"T12:00:00");
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const wdOf = s => parse(s).getDay();
const hm = s => { if(!s) return 0; const [h,m] = String(s).split(/[:.]/).map(Number); return h*60+(m||0); };
const fmt = m => { m = Math.round(m); const h = Math.floor(m/60); return pad(h%24)+":"+pad(m%60); };
const dur = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? (r ? h+"h "+r+"m" : h+"h") : r+"m"; };
const r5 = m => Math.max(5, Math.round(m/5)*5);
const c5 = m => Math.ceil(m/5)*5;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const mondayOf = s => { const w = wdOf(s); return addDays(s, w===0 ? -6 : 1-w); };
const longDate = s => parse(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const shortDate = s => parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60+d.getMinutes(); };
const catVar = c => c === "_event" ? "var(--c-event)" : "var(--p-"+(CATCOL[normCat(c)] || "slate")+")";
const catName = c => c === "_event" ? "Meetings & events" : (CATS[normCat(c)] || "Other");
const clone = o => JSON.parse(JSON.stringify(o));
const isOneOff = t => !t.recur || t.recur === "none";
function ring(pct, cc, size, label){
  const r = size/2 - 4, c = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct||0));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+Math.round(p*100)+'% done" style="flex:none"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--rule)" stroke-width="5"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+cc+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="'+(size/4.4)+'" font-family="IBM Plex Mono, monospace" fill="var(--ink)">'+esc(label ?? Math.round(p*100)+"%")+'</text></svg>';
}

// ---------- state ----------
const S = {settings: clone(DEFAULT_SETTINGS), tasks:{}, goals:{}, blocks:{}, events:{}, habits:{}, days:{}, sync:{}, trips:{}};
const ui = {mail:{state:"idle", msg:""}, view:"day", date: today(), tab:"todo", sync:{state:"idle", msg:""}, shot:{busy:false, msg:""}, level:"task", weekMode:"planner", monthMode:"calendar", focusCat:null, focusGoal:null, open:new Set(), loaded:false, live:false};
try { const o = JSON.parse(localStorage.getItem("planner.ui")||"{}"); ["view","tab","weekMode","monthMode"].forEach(k => { if (o[k] != null) ui[k] = o[k]; }); } catch(e){}
if (!["day","week","month","done"].includes(ui.view)) ui.view = "day";
if (ui.tab === "setup") ui.tab = "setup";
if (!["todo","plan","confirm","goals","setup"].includes(ui.tab)) ui.tab = "todo";
if (!LEVELS[ui.level]) ui.level = "goal";
const remember = () => { try { localStorage.setItem("planner.ui", JSON.stringify({view:ui.view, tab:ui.tab, weekMode:ui.weekMode, monthMode:ui.monthMode})); } catch(e){} };
let db = null;
const writeChains = {};

function persist(path, body){
  if (!ui.live) return;
  const prev = writeChains[path] || Promise.resolve();
  writeChains[path] = prev.then(() => body === null ? db.doc(path).delete() : db.doc(path).set(body)).catch(err => {
    toast(err && err.code === "quota_exceeded" ? "Storage is full: delete some old items." : "Couldn't save that change. Check your connection and try again.");
  });
}
function put(coll, obj){ S[coll][obj.id] = obj; const b = clone(obj); delete b.id; persist(coll+"/"+obj.id, b); }
function save(coll, obj){ put(coll, obj); render(); }
function remove(coll, id){ delete S[coll][id]; persist(coll+"/"+id, null); render(); }
function saveSettings(){ persist("settings/main", clone(S.settings)); render(); }
function dayDoc(ds){ return S.days[ds] || (S.days[ds] = {entries:{}, habits:{}}); }
function saveDay(ds){ const d = dayDoc(ds); persist("days/"+ds, {entries:d.entries||{}, habits:d.habits||{}, clashOk:d.clashOk||{}, pins:d.pins||{}}); render(); }
const isPending = ev => ev.status === "pending" || ev.status === "rejected";
const nextPrio = () => Math.max(0, ...Object.values(S.tasks).map(t => +t.prio||0), ...Object.values(S.goals).map(g => +g.prio||0)) + 1;

// ---------- recurrence ----------
function occurs(o, ds){
  if (o.skipDates && o.skipDates.includes(ds)) return false;
  const r = o.recur || "none";
  if (r === "none") return o.date === ds;
  if (o.date && ds < o.date) return false;
  if (o.until && ds > o.until) return false;
  const w = wdOf(ds);
  if (r === "daily") return true;
  if (r === "weekdays") return w >= 1 && w <= 5;
  if (r === "weekly") { if (!((o.days && o.days.length) ? o.days : [wdOf(o.date || ds)]).includes(w)) return false;
    const n = Math.max(1, +o.everyWeeks || 1); return n === 1 || !o.date || (Math.round(daysBetween(mondayOf(o.date), mondayOf(ds)) / 7) % n) === 0; }
  if (r === "monthly") return parse(ds).getDate() === (+o.monthDay || parse(o.date || ds).getDate());
  return false;
}
function recurText(o){
  const r = o.recur || "none";
  if (r === "none") return o.date ? shortDate(o.date) : "Any day";
  const end = o.until ? " until " + shortDate(o.until) : "";
  if (r === "daily") return "Every day" + end;
  if (r === "weekdays") return "Every weekday" + end;
  if (r === "weekly") return "Every " + (+o.everyWeeks > 1 ? o.everyWeeks + " weeks on " : "") + ((o.days && o.days.length) ? o.days : [wdOf(o.date||today())]).map(d => DOW[d]).join(", ") + end;
  if (r === "monthly") return "Monthly on day " + (+o.monthDay || parse(o.date||today()).getDate()) + end;
  return "";

  return ms.map(m => "From: " + (m.sender || m.from || "") + "\nDate: " + (m.date || "") + "\nSubject: " + (m.subject || "") + "\n" + String(m.plainTextBody || m.body || m.text || m.snippet || "").slice(0, 3500)).join("\n---\n").slice(0, 7000);

function scheduledIn(days){
  const map = {};
  for (const d of days) for (const i of workItems(d)) {
    const id = i.taskId ? "task:"+i.taskId : i.goalId ? "goal:"+i.goalId : null;
    if (!id) continue;
    const m = map[id] = map[id] || {first:null, n:0, done:0, min:0};
    if (i.kind === "done") m.done++; else { m.n++; if (!m.first) m.first = {d, s:i.start}; }
    m.min += i.end - i.start;
  }
  return map;
}

    if (short <= 0) return null;
    const others = [0,1,2,3,4,5,6].filter(w => !goalDays(g).includes(w) && r.byW[w] > 0).sort((a,b) => r.byW[b] - r.byW[a]);

function applyGoogle(list, from, to){
  const seen = new Set(); let changed = 0;
  for (const x of list) {
    if (!x || !x.id) continue;
    const id = "g-" + safeId(x.id), cur = S.events[id];
    const declined = (x.attendees || []).some(a => a && a.self && a.responseStatus === "declined");
    if (x.status === "cancelled" || declined) continue;
    const f = gFields(x); if (!f) continue;
    seen.add(id);
    const next = {...(cur || {travelMin:0}), ...f, id};
    if (!cur || JSON.stringify(Object.keys(f).map(k => cur[k])) !== JSON.stringify(Object.keys(f).map(k => f[k]))) { put("events", next); changed++; }
  }
  for (const ev of Object.values(S.events)) if (ev.source === "google" && ev.date >= from && ev.date <= to && !seen.has(ev.id)) { delete S.events[ev.id]; persist("events/" + ev.id, null); changed++; }
  return {n:seen.size, changed};
}
async function googleSync(manual){
  if (ui.sync.state === "busy") return;
  if (!mcp || !ui.live) { if (manual) { ui.sync = {state:"error", msg:"Calendar sync works when the planner is open in Claude."}; render(); } return; }
  ui.sync = {state:"busy", msg:""}; if (ui.tab === "setup") renderDrawer();
  const from = addDays(today(), -1), to = addDays(today(), 60);
  try {
    const list = []; let token = null, pages = 0;
    do {
      const input = {calendarId:GCAL_ID, startTime:from+"T00:00:00", endTime:to+"T23:59:00", pageSize:250, orderBy:"startTime"};
      if (token) input.pageToken = token;
      const res = await callGcal(input), pl = (res && res.payload) || {};
      (pl.events || pl.items || []).forEach(x => list.push(x));
      token = pl.nextPageToken || null; pages++;
    } while (token && pages < 6);
    const r = applyGoogle(list, from, to);
    ui.sync = {state:"ok", msg:"Synced just now: " + r.n + " event" + (r.n === 1 ? "" : "s") + " in the next two months"};
    S.sync = {...S.sync, lastGoogleSync:new Date().toISOString()}; persist("sync/state", clone(S.sync));
  } catch (e) { ui.sync = {state:"error", msg:syncError(e)}; }
  render();
}

async function readScreenshot(file){
  if (!sampleFn || ui.shot.busy) return;
  ui.shot = {busy:true, msg:""}; renderDrawer();
  const t0 = today();
  const prompt = "The image is a screenshot of a work calendar (Outlook). Today is " + t0 + " (" + DOW[wdOf(t0)] + "). List every meeting or appointment you can read clearly. Reply with only a JSON array of objects shaped {\"title\": string, \"date\": \"YYYY-MM-DD\", \"start\": \"HH:MM\", \"end\": \"HH:MM\", \"location\": string}. Use 24-hour times. Work out each date from the day headers; when no year is shown, pick the date closest to today. Leave out all-day items, cancelled items and anything you cannot read. Example: [{\"title\":\"Stand-up\",\"date\":\"" + t0 + "\",\"start\":\"09:00\",\"end\":\"09:15\",\"location\":\"\"}]";
  try {
    const arr = await sampleFn.json(prompt, {images:[file], cache:false});
    let n = 0, dup = 0; const addedIds = [];
    (Array.isArray(arr) ? arr : []).slice(0, 80).forEach(x => {
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(String(x.date)) || !/^\d{1,2}[:.]\d{2}$/.test(String(x.start)) || !/^\d{1,2}[:.]\d{2}$/.test(String(x.end))) return;
      const ev = {id:"s-" + uid(), title:String(x.title || "Meeting").slice(0, 200), cal:"work", date:x.date, start:fmt(hm(x.start)), end:fmt(hm(x.end)), location:String(x.location || "").slice(0, 200), travelTo:0, backOn:false, travelBack:0, recur:"none", source:"screenshot"};
      if (hm(ev.end) <= hm(ev.start)) return;
      if (Object.values(S.events).some(o => o.date === ev.date && o.start === ev.start && String(o.title).toLowerCase() === ev.title.toLowerCase())) { dup++; return; }
      put("events", ev); n++; addedIds.push(ev.id);
    });
    ui.shot = {busy:false, msg: n ? n + " added to your planner." + (dup ? " " + dup + " were already in." : "") : dup ? "Everything in it was already in your planner." : "No meetings found in that picture."};
    render(); if (n) shotClashModal(addedIds); return;
  } catch (e) {
    const c = e && e.code;
    ui.shot = {busy:false, msg: c === "not_granted" || c === "sampling_disabled" ? "Reading screenshots needs your OK for Claude. Allow it and try again." : c === "image_rejected" ? "That file couldn't be read. Try a PNG or JPG." : c === "rate_limited" ? "Too many requests just now. Try again in a minute." : c === "invalid_json" ? "Couldn't make out the meetings. Try a sharper or smaller screenshot." : c === "cancelled" ? "" : "Something went wrong reading it. Try again."};
  }
  render();
}

  const t0 = today();
  for (const t of Object.values(S.tasks)) {

    put("tasks", {...t, firstDate:t.firstDate||t.date, date:t0, moves:[...(t.moves||[]), {from:t.date, to:t0, by:"planner"}]});
  }
}

async function boot(){
